<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="system-ui, sans-serif" font-size="12" role="img" aria-label="Latency and errors vs players">
<style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--muted:#52514e;--grid:#e4e3df;--s1:#2a78d6;--s2:#eb6834;--err:#e34948}@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--muted:#c3c2b7;--grid:#3a3936;--s1:#3987e5;--s2:#d95926;--err:#e66767}}text{fill:var(--muted)} .t{fill:var(--ink);font-size:15px;font-weight:600} .grid{stroke:var(--grid)}.s1{stroke:var(--s1)} .s2{stroke:var(--s2)} .f1{fill:var(--s1)} .f2{fill:var(--s2)}</style>
<rect width="720" height="470" fill="var(--bg)"/>
<text class="t" x="64" y="24">Latency and errors vs players</text>
<line class="s1" x1="64" y1="46" x2="86" y2="46" stroke-width="2"/><text x="92" y="50">answer p50</text>
<line class="s1" x1="184" y1="46" x2="206" y2="46" stroke-width="2" stroke-dasharray="6 4"/><text x="212" y="50">answer p95</text>
<line class="s2" x1="304" y1="46" x2="326" y2="46" stroke-width="2"/><text x="332" y="50">API p50</text>
<line class="s2" x1="424" y1="46" x2="446" y2="46" stroke-width="2" stroke-dasharray="6 4"/><text x="452" y="50">API p95</text>
<text x="544" y="50">seconds, scored answers</text>
<line class="grid" x1="64" y1="290.0" x2="696" y2="290.0"/><text x="56" y="294.0" text-anchor="end">0 s</text>
<line class="grid" x1="64" y1="246.0" x2="696" y2="246.0"/><text x="56" y="250.0" text-anchor="end">0.2 s</text>
<line class="grid" x1="64" y1="202.0" x2="696" y2="202.0"/><text x="56" y="206.0" text-anchor="end">0.4 s</text>
<line class="grid" x1="64" y1="158.0" x2="696" y2="158.0"/><text x="56" y="162.0" text-anchor="end">0.6 s</text>
<line class="grid" x1="64" y1="114.0" x2="696" y2="114.0"/><text x="56" y="118.0" text-anchor="end">0.8 s</text>
<line class="grid" x1="64" y1="70.0" x2="696" y2="70.0"/><text x="56" y="74.0" text-anchor="end">1 s</text>
<polyline class="s1" points="222.0,124.6 696.0,117.7" fill="none" stroke-width="2"/>
<circle class="f1" cx="222.0" cy="124.6" r="4" stroke="var(--bg)" stroke-width="2"><title>1 players: answer p50 0.752 s</title></circle>
<circle class="f1" cx="696.0" cy="117.7" r="4" stroke="var(--bg)" stroke-width="2"><title>4 players: answer p50 0.783 s</title></circle>
<polyline class="s1" points="222.0,113.8 696.0,103.0" fill="none" stroke-width="2" stroke-dasharray="6 4"/>
<circle class="f1" cx="222.0" cy="113.8" r="4" stroke="var(--bg)" stroke-width="2"><title>1 players: answer p95 0.801 s</title></circle>
<circle class="f1" cx="696.0" cy="103.0" r="4" stroke="var(--bg)" stroke-width="2"><title>4 players: answer p95 0.850 s</title></circle>
<polyline class="s2" points="222.0,235.2 696.0,228.2" fill="none" stroke-width="2"/>
<circle class="f2" cx="222.0" cy="235.2" r="4" stroke="var(--bg)" stroke-width="2"><title>1 players: API p50 0.249 s</title></circle>
<circle class="f2" cx="696.0" cy="228.2" r="4" stroke="var(--bg)" stroke-width="2"><title>4 players: API p50 0.281 s</title></circle>
<polyline class="s2" points="222.0,224.4 696.0,213.4" fill="none" stroke-width="2" stroke-dasharray="6 4"/>
<circle class="f2" cx="222.0" cy="224.4" r="4" stroke="var(--bg)" stroke-width="2"><title>1 players: API p95 0.298 s</title></circle>
<circle class="f2" cx="696.0" cy="213.4" r="4" stroke="var(--bg)" stroke-width="2"><title>4 players: API p95 0.348 s</title></circle>
<text x="64" y="326">error rate (of answers)</text>
<line class="grid" x1="64" y1="420.0" x2="696" y2="420.0"/><text x="56" y="424.0" text-anchor="end">0%</text>
<line class="grid" x1="64" y1="380.0" x2="696" y2="380.0"/><text x="56" y="384.0" text-anchor="end">5%</text>
<line class="grid" x1="64" y1="340.0" x2="696" y2="340.0"/><text x="56" y="344.0" text-anchor="end">10%</text>
<text x="222.0" y="415.0" text-anchor="middle">0%</text>
<text x="696.0" y="415.0" text-anchor="middle">0%</text>
<text x="222.0" y="438" text-anchor="middle">1</text>
<text x="696.0" y="438" text-anchor="middle">4</text>
<text x="380.0" y="458" text-anchor="middle">players (concurrent streams)</text>
</svg>
