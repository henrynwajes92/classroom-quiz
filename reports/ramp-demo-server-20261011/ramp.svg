<circle class="f2" cx="538.0" cy="215.2" r="4" stroke="var(--bg)" stroke-width="2"><title>3 players: API p95 0.340 s</title></circle>
<circle class="f2" cx="696.0" cy="213.0" r="4" stroke="var(--bg)" stroke-width="2"><title>4 players: API p95 0.350 s</title></circle>
